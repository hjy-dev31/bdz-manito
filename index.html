<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>불도저 MT · 마니또 미션 공개</title>
<link rel="stylesheet" href="style.css">

<main id="entrance">
<article class="admission-ticket"><div class="serial">FS BULLDOZER</div>
<div class="ticket-body">
<div class="crest" role="img" aria-label="FS BULLDOZER 엠블럼"></div>
<h1>불도저 MT 마니또 미션 공개</h1>
<form id="login">
<label>번호<input required name="number" inputmode="numeric" enterkeyhint="next" autocomplete="username"></label>
<label>이름<input required name="name" autocomplete="name" enterkeyhint="next"></label>
<label>비밀번호<input required type="password" name="password" autocomplete="current-password" enterkeyhint="go"></label>
<button>입장하기</button><p id="notice" role="status"></p>
</form></div>
<div class="ticket-stub" aria-hidden="true"><span>ADMIT ONE</span><i></i></div>
</article></main>
<main id="game" hidden>
<article>
<div class="serial"><span>FS BULLDOZER</span><span id="number"></span></div>
<div class="crest" role="img" aria-label="FS BULLDOZER 엠블럼"></div>
<h1>나의 마니또 미션</h1>
<p>은박 아래에 나만의 미션이 있어요.</p>
<div class="panel"><div id="result" aria-hidden="true"></div><canvas id="foil" width="300" height="82" aria-label="손가락이나 마우스로 긁는 은박 영역"></canvas></div>
<div class="stub"><span>MANITO SCRATCH</span><i></i></div>
</article>
<p id="message" role="status"></p>
<button id="action"></button>
</main>
<script src="game.js"></script>
<script src="login.js"></script>
</html>
